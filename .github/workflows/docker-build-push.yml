name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches: [ mainn, cinema, cinema-local ]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  MONOLITH_IMAGE_NAME: ${{ github.repository }}/monolith
  MOVIES_SERVICE_IMAGE_NAME: ${{ github.repository }}/movies-service
  EVENTS_SERVICE_IMAGE_NAME: ${{ github.repository }}/events-service
  PROXY_SERVICE_IMAGE_NAME: ${{ github.repository }}/proxy-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Monolith
        id: meta-monolith
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and load Monolith Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          push: false
          load: true
          tags: ${{ steps.meta-monolith.outputs.tags }}
          labels: ${{ steps.meta-monolith.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for Movies Service
        id: meta-movies
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and load Movies Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          push: false
          load: true
          tags: ${{ steps.meta-movies.outputs.tags }}
          labels: ${{ steps.meta-movies.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for proxy-service
        id: meta-proxy-service
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and load proxy-service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          push: false
          load: true
          tags: ${{ steps.meta-proxy-service.outputs.tags }}
          labels: ${{ steps.meta-proxy-service.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for events-service
        id: meta-events-service
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and load events-service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          push: false
          load: true
          tags: ${{ steps.meta-events-service.outputs.tags }}
          labels: ${{ steps.meta-events-service.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
            
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Start services for testing
        run: docker-compose up -d

      - name: Show initial container logs
        if: always() 
        run: docker-compose logs --tail="50"

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for all services to become available..."
          TIMEOUT=120
          END_TIME=$((SECONDS + TIMEOUT))
          
          # Мы не можем использовать healthcheck, поэтому будем проверять порты
          # wait-for-it.sh здесь недоступен, используем nc
          
          # Сначала ждем, когда docker-compose поднимет все контейнеры
          until [ "$(docker-compose ps -q | wc -l)" -eq $(docker-compose ps --services | wc -l) ]; do
            if [ $SECONDS -gt $END_TIME ]; then echo "Timeout waiting for containers to start"; exit 1; fi
            sleep 2
          done

          echo "All containers are up, now checking ports..."
          
          SERVICES_PORTS="monolith:8080 movies-service:8081 proxy-service:8000 events-service:8082"

          for sp in $SERVICES_PORTS; do
            SERVICE=$(echo $sp | cut -d: -f1)
            PORT=$(echo $sp | cut -d: -f2)
            echo "Waiting for $SERVICE on port $PORT..."
            
            # Внутри CI runner'а нужно обращаться к localhost, так как порты проброшены
            while ! nc -z localhost $PORT >/dev/null 2>&1; do
              if [ $SECONDS -gt $END_TIME ]; then
                echo "Timeout waiting for $SERVICE on localhost:$PORT."
                docker-compose logs $SERVICE
                exit 1
              fi
              sleep 2
            done
            echo "$SERVICE is up!"
          done
          echo "All services are ready for tests!"

      - name: Run API tests
        run: |
          cd tests/postman
          npm install
          npm run test:local
